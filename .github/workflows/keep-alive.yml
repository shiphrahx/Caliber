name: Keep Supabase Alive

on:
  schedule:
    # Twice a day, off the hour — midnight UTC is the most contended slot and
    # scheduled runs there are delayed or dropped outright.
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail
          [ -n "$SUPABASE_URL" ] || { echo "::error::SUPABASE_
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::SUPABASE_ANON_KEY not set"; exit 1; }

          base="${SUPABASE_URL%/}"
          # The project ref, so a secret pointing at the WRONG
          # in the log instead of passing silently for months.
          echo "Project ref: $(echo "$base" | sed -E 's#https:

          fail=0
          call() { # method, path, key, extra args...
            local method="$1" path="$2" key="$3"; shift 3
            local body code
            body=$(curl -sS --max-time 30 -w $'\n%{http_code}'
              "${base}${path}" \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" "$@") || { echo "::error::curl failed for $path"; fail=1; return; }
            code="${body##*$'\n'}"; body="${body%$'\n'*}"
            echo "$method $path -> HTTP $code : ${body:0:200}"
            [ "$code" -lt 400 ] || fail=1
          }

          # Several reads, so the day's activity isn't a single row.
          call GET "/rest/v1/achievements?select=id&limit=1" "
          call GET "/rest/v1/achievements?select=count" "$SUPABASE_ANON_KEY" -H "Prefer: count=exact"

          # A WRITE. Reads are meant to count, but a write is unambiguous database
          # activity and cannot be answered from anywhere but
          if [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            call POST "/rest/v1/keepalive" "$SUPABASE_SERVICE_
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates" \
              -d "{\"id\":1,\"pinged_at\":\"$(date -u +%FT%TZ)\"}"
          else
            echo "::warning::No service-role key set — read-only ping."
          fi

          [ "$fail" -eq 0 ] || { echo "::error::One or more pi
          echo "Keep-alive succeeded."

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            # unchanged
