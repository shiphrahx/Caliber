name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'app/page.tsx'
      - 'app/layout.tsx'
      - 'app/globals.css'
      - 'app/privacy/**'
      - 'app/terms/**'
      - 'public/**'
      - 'next.config.ts'
      - 'scripts/pages-export.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Strips everything that needs a server, then exports what is left.
      - run: node scripts/pages-export.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
